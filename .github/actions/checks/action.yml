# Content-keyed checks for any repository.
#
# Put a .holo/checks.json in a repository, call this action, and a check runs only when the
# content it reads has no result yet. A change that touches nothing a check reads runs nothing.
# See "Use it in any GitHub repository" in the README for the definitions format and its limits.
name: Content-keyed checks
description: Run the checks in .holo/checks.json that have no result for the content being built.

inputs:
  checks:
    description: Names of the checks to run, separated by spaces. Empty means every check defined.
    default: ''
  run:
    description: "'false' only reports which checks have no result, without running anything."
    default: 'true'
  strict:
    description: "'true' fails the job when a check cannot run on this machine. 'false' skips it."
    default: 'true'
  cache:
    description: "'true' restores earlier results and saves the new ones. 'save' only saves, for when an earlier step in the same job restored them. 'false' does neither."
    default: 'true'
  retry:
    description: "'auto' runs failed checks again when the run is a re-run, keeping every pass. 'true' always does, 'false' never."
    default: 'auto'
  fail-fast:
    description: "'true' stops at the first failing check. The checks left are listed as not run."
    default: 'false'
  store:
    description: Address of a shared store of signed results. Empty means results stay in this repository's cache.
    default: ''
  signers-ref:
    description: The ref to read .holo/signers.json from. Name the protected branch, never the change being checked.
    default: ''

outputs:
  missing:
    description: Names of the checks with no result for this content, separated by spaces.
    value: ${{ steps.plan.outputs.missing }}

runs:
  using: composite
  steps:
    # Results are files named by action key; what checks produced is kept beside them, by digest.
    # GitHub keeps them between runs. Each run restores the most recent set, for this leg first,
    # and saves under a new name, so results accumulate. Restoring and saving are separate steps
    # because the saving must happen when a check fails or the run is cancelled: the checks that
    # passed are not to be run again on the next attempt.
    - name: Bring back earlier check results
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          .holo/results
          .holo/outputs
        key: holo-results-${{ runner.os }}-${{ inputs.checks }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          holo-results-${{ runner.os }}-${{ inputs.checks }}-
          holo-results-${{ runner.os }}-
    - name: See which checks have no result for this content
      id: plan
      shell: bash
      env:
        HOLO_STORE: ${{ inputs.store }}
        HOLO_SIGNERS_REF: ${{ inputs.signers-ref }}
      run: |
        node "$GITHUB_ACTION_PATH/../../../scripts/check.mjs" keys | tee "$RUNNER_TEMP/holo-keys.log"
        echo "missing=$(grep '  no result$' "$RUNNER_TEMP/holo-keys.log" | awk '{print $2}' | tr '\n' ' ')" >>"$GITHUB_OUTPUT"
    - name: Run the checks that have no result
      if: inputs.run == 'true'
      shell: bash
      env:
        HOLO_CHECKS: ${{ inputs.checks }}
        HOLO_STRICT: ${{ inputs.strict }}
        HOLO_FAIL_FAST: ${{ inputs.fail-fast }}
        HOLO_RETRY: ${{ inputs.retry }}
        HOLO_ATTEMPT: ${{ github.run_attempt }}
        HOLO_STORE: ${{ inputs.store }}
        HOLO_SIGNERS_REF: ${{ inputs.signers-ref }}
      run: |
        set -o pipefail
        flags=''
        if [ "$HOLO_STRICT" = 'true' ]; then flags='--strict'; fi
        if [ "$HOLO_FAIL_FAST" = 'true' ]; then flags="$flags --fail-fast"; fi
        # A re-run of the same content is someone saying a failure was not the content's fault.
        # Stored failures run again; stored passes stand.
        if [ "$HOLO_RETRY" = 'true' ] || { [ "$HOLO_RETRY" = 'auto' ] && [ "$HOLO_ATTEMPT" -gt 1 ]; }; then flags="$flags --retry"; fi
        # The status must be taken here: a later command would replace it.
        status=0
        # shellcheck disable=SC2086
        node "$GITHUB_ACTION_PATH/../../../scripts/check.mjs" run $flags $HOLO_CHECKS | tee "$RUNNER_TEMP/holo-checks.log" || status=$?
        {
          echo '## Checks'
          echo
          echo '```'
          grep -E '^[a-z0-9][a-z0-9-]*: (pass|fail|cannot|not defined|running|note)|^[0-9]+ checks?:|^not run after' "$RUNNER_TEMP/holo-checks.log" || true
          echo '```'
        } >>"$GITHUB_STEP_SUMMARY"
        exit "$status"
    - name: Keep the results, whatever the outcome
      if: always() && inputs.run == 'true' && inputs.cache != 'false'
      uses: actions/cache/save@v4
      with:
        path: |
          .holo/results
          .holo/outputs
        key: holo-results-${{ runner.os }}-${{ inputs.checks }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
