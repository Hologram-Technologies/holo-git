# Runs the checks that have no result for this content, builds the page, and publishes it
# with a static replica of this repository beside it, so the page can clone its own source.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out with full history, so the replica has it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use a current Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      # A check runs only when the content it reads has no result yet. The action is this
      # repository's own, the same one other repositories can call.
      - name: See which checks have no result for this content
        id: need
        uses: ./.github/actions/checks
        with:
          run: 'false'
      - name: Start a real S3-compatible store with throwaway keys
        if: contains(steps.need.outputs.missing, 'store')
        run: |
          {
            echo "S3_TEST_ACCESS_KEY=test$(openssl rand -hex 8)"
            echo "S3_TEST_SECRET_KEY=$(openssl rand -hex 24)"
            echo "S3_TEST_ENDPOINT=http://127.0.0.1:8333"
          } >>"$GITHUB_ENV"
      - name: Wait for the store
        if: contains(steps.need.outputs.missing, 'store')
        run: sh scripts/dev-s3.sh start
      - name: Run the checks that have no result
        uses: ./.github/actions/checks
        with:
          cache: 'false'
      - name: Build the page
        run: |
          sh scripts/build-web.sh | tee build.log
          {
            echo '## Page digest'
            echo
            echo 'The live page shows this value in its footer. If the two differ, do not accept the page.'
            echo
            echo '```'
            grep '^shell:' build.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
