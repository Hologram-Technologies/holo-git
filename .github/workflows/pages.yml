# Runs the checks that have no result for this content, builds the page, and publishes it
# with a static replica of this repository beside it, so the page can clone its own source.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out with full history, so the replica has it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use a current Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      # Check results are kept by action key: a digest of a check's definition and of the content
      # it reads. A check whose key already has a result here does not run again.
      - name: Bring back earlier check results
        uses: actions/cache@v4
        with:
          path: .holo/results
          key: holo-results-${{ runner.os }}-${{ github.sha }}
          restore-keys: holo-results-${{ runner.os }}-
      - name: See which checks have no result for this content
        id: need
        run: |
          node scripts/check.mjs keys | tee keys.log
          if grep -q '  page  no result' keys.log; then echo "page=run" >>"$GITHUB_OUTPUT"; fi
      - name: Start a real S3-compatible store with throwaway keys
        if: steps.need.outputs.page == 'run'
        run: |
          {
            echo "S3_TEST_ACCESS_KEY=test$(openssl rand -hex 8)"
            echo "S3_TEST_SECRET_KEY=$(openssl rand -hex 24)"
            echo "S3_TEST_ENDPOINT=http://127.0.0.1:8333"
          } >>"$GITHUB_ENV"
      - name: Wait for the store
        if: steps.need.outputs.page == 'run'
        run: sh scripts/dev-s3.sh start
      - name: Run the checks that have no result
        run: |
          node scripts/check.mjs run | tee checks.log
          {
            echo '## Checks'
            echo
            echo '```'
            grep -E '^(engine|page|model): |^[0-9]+ checks?:' checks.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Build the page
        run: |
          sh scripts/build-web.sh | tee build.log
          {
            echo '## Page digest'
            echo
            echo 'The live page shows this value in its footer. If the two differ, do not accept the page.'
            echo
            echo '```'
            grep '^shell:' build.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
