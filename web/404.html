<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>holo-git</title>
<!-- A static host answers a deep link it has no file for with this page. It finds the page's root,
     sends the visitor there and carries the address along as ?p=, where web/ui/router.js puts it back.
     Once the service worker is in place it answers deep links itself and this file is not used.
     The root is the shortest leading part of the address under which the page's own files are found,
     so the same file works at a domain's root and under any path. -->
<script>
(async function () {
  var parts = location.pathname.split('/').filter(Boolean);
  for (var depth = 0; depth <= parts.length; depth += 1) {
    var root = '/' + parts.slice(0, depth).map(function (p) { return p + '/'; }).join('');
    try {
      var answer = await fetch(root + 'ui/theme-init.js', { method: 'HEAD', cache: 'no-store' });
      if (!answer.ok) continue;
    } catch (e) { continue; }
    var rest = '/' + parts.slice(depth).join('/');
    location.replace(root + (rest === '/' || rest === '/404.html' ? '' : '?p=' + encodeURIComponent(rest + location.search)) + location.hash);
    return;
  }
  document.body.textContent = 'Page not found.';
}());
</script>
</head>
<body></body>
</html>
